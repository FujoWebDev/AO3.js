name: Publish Package

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      # The version bump is pushed with a token so GITHUB_TOKEN stays read-only.
      contents: read
      id-token: write # Allows GitHub to generate OIDC tokens required for provenance

    steps:
      # persist-credentials: false keeps tokens out of .git/config while npm ci/tests run third-party code.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build

      - name: Set package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # Fetch the latest release tag using the GitHub CLI
            VERSION=$(gh release view --json tagName --jq .tagName | sed 's/^v//')
          fi

          echo "Setting package version to ${VERSION}"
          # Persist VERSION for later steps so we can use it for the commit message
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          npm version $VERSION --no-git-tag-version

      - name: Update npm for OIDC
        run: npm install -g npm@11.15.0
        
      - run: npm publish --provenance --access=public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit package version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          APP_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

          # Release events build from the tag (detached HEAD), so move to main's tip
          # and reapply the bump there.
          git checkout -- package.json package-lock.json
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
          npm version "$VERSION" --no-git-tag-version

          git add package.json package-lock.json

          # Only commit if there are changes to commit so the action doesn't fail
          if ! git diff --staged --quiet; then
            # The [skip ci] in the commit message prevents this commit from re-triggering workflows.
            git commit -m "${VERSION} has shipped ⛵🌟💖 [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi
